<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=index.html">
    <script>window.location.replace('index.html');</script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><style>@media(prefers-color-scheme:dark){line{stroke:white}}@media(prefers-color-scheme:light){line{stroke:black}}</style><line x1='32' y1='0' x2='32' y2='64' stroke='black' stroke-width='6'/><line x1='0' y1='32' x2='64' y2='32' stroke='black' stroke-width='6'/></svg>">
    <title>Mohammad Fasahat | Creative</title>
    <style>
        :root {
            --bg:      #050505;
            --fg:      #FFFFFF;
            --muted:   #666666;
            --line:    rgba(255,255,255,0.12);
            --font:    'Helvetica Neue', Helvetica, Arial, sans-serif;
            --nav-h:   100px;
            --col-w:   104px;   /* collapsed panel width */
        }
        body.light-mode {
            --bg:    #F4F4F4;
            --fg:    #111111;
            --muted: #888888;
            --line:  rgba(0,0,0,0.12);
        }

        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

        html, body {
            height: 100%; overflow: hidden;
            background: var(--bg); color: var(--fg);
            font-family: var(--font);
            transition: background 0.4s, color 0.4s;
            cursor: crosshair;
        }
        a { text-decoration: none; color: inherit; }
        button { cursor: pointer; background: none; border: none; color: inherit; font-family: var(--font); }

        /* ── NAV ─────────────────────────────────────────── */
        nav {
            position: fixed; top: 0; left: 0; width: 100%; height: var(--nav-h);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 40px; z-index: 300;
            background: transparent;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        }
        .brand { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer; }
        .nav-right { display: flex; align-items: center; gap: 28px; }
        .theme-toggle { width: 18px; height: 18px; border-radius: 50%; background: var(--fg); border: 1px solid var(--bg); transition: transform 0.3s; cursor: pointer; }
        .theme-toggle:hover { transform: scale(1.1); }
        .mobile-menu-btn { display: none; font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }

        /* ── MOBILE OVERLAY ──────────────────────────────── */

        /* ── PANELS CONTAINER ────────────────────────────── */
        .panels {
            position: fixed;
            top: var(--nav-h); left: 0; right: 0; bottom: 0;
            display: flex;
            /* no border here — canvas draws the dividers */
        }

        /* ── SINGLE PANEL ────────────────────────────────── */
        .panel {
            position: relative;
            overflow: hidden;
            transition: width 0.75s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }
        .panel.active { cursor: default; }

        /* ── COLLAPSED LABEL (rotated centre) ────────────── */
        .label-col {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotate(-90deg);
            white-space: nowrap;
            display: flex; align-items: center; gap: 10px;
            transition: opacity 0.2s;
            pointer-events: none;
            user-select: none;
        }
        .label-col .lc-num  { font-size: 9px; font-family: 'Courier New', monospace; color: var(--muted); letter-spacing: 1px; }
        .label-col .lc-name { font-size: 10px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }

        /* ── EXPANDED LABEL ──────────────────────────────── */
        .label-exp {
            position: absolute;
            top: 26px; left: 28px;
            display: flex; align-items: baseline; gap: 12px;
            opacity: 0;
            transition: opacity 0.25s 0.32s;
            pointer-events: none;
            user-select: none;
            z-index: 10;
        }
        .label-exp .le-num  { font-size: 9px; font-family: 'Courier New', monospace; color: var(--muted); letter-spacing: 1px; }
        .label-exp .le-name { font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--fg); }

        .panel.active .label-col { opacity: 0; }
        .panel.active .label-exp { opacity: 1; }

        /* ── ITEMS STRIP ─────────────────────────────────── */
        .panel-items {
            position: absolute;
            /* top clears the label; bottom leaves breathing room */
            top: 76px; left: 0; right: 0; bottom: 52px;
            display: flex;
            align-items: center;        /* centre tiles vertically */
            gap: 12px;
            padding: 0 28px;
            overflow-x: auto; overflow-y: hidden;
            scrollbar-width: none;
            opacity: 0;
            transition: opacity 0.25s;
            pointer-events: none;
        }
        .panel-items::-webkit-scrollbar { display: none; }

        .panel.active .panel-items {
            opacity: 1;
            pointer-events: all;
            transition: opacity 0.3s 0.36s;
        }

        /* ── ITEM ─────────────────────────────────────────── */
        .p-item {
            flex-shrink: 0;
            /* smaller tiles with breathing above + below */
            height: clamp(180px, calc(100vh - 330px), 440px);
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }
        .p-item img {
            height: 100%;
            width: auto;
            display: block;
            object-fit: cover;
            filter: grayscale(12%);
            transition: filter 0.4s, transform 0.5s;
            pointer-events: none;
        }
        .p-item:hover img { filter: grayscale(0%); transform: scale(1.025); }

        /* caption overlay */
        .p-item .cap {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 32px 14px 14px;
            background: linear-gradient(transparent, rgba(0,0,0,0.6));
            opacity: 0;
            transition: opacity 0.3s;
        }
        .p-item:hover .cap { opacity: 1; }
        .cap-title { font-size: 12px; color: #fff; }
        .cap-sub   { font-size: 9px; color: rgba(255,255,255,0.55); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

        /* empty placeholder */
        .p-item.empty {
            height: clamp(180px, calc(100vh - 330px), 440px);
            width:  clamp(240px, calc((100vh - 330px) * 4/3), 586px);
            background: var(--line);
            cursor: default;
        }

        /* scroll hint */
        .scroll-hint {
            position: fixed; bottom: 18px; right: 40px;
            font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase;
            color: var(--muted); z-index: 200; pointer-events: none;
            transition: opacity 0.5s;
        }
        .scroll-hint.gone { opacity: 0; }

        /* ── MOBILE ──────────────────────────────────────── */
        @media (max-width: 768px) {
            html, body { overflow: auto; }
            nav { padding: 0 20px; }

            .panels {
                position: relative; top: 0;
                flex-direction: column; height: auto;
            }
            .panel {
                width: 100% !important;
                height: 56px;
                border-bottom: 1px solid var(--line);
                transition: height 0.6s cubic-bezier(0.4,0,0.2,1);
            }
            .panel.active { height: 68vw; }
            .label-col { top: 50%; left: 22px; transform: translateY(-50%); }
            .label-exp { top: 12px; left: 18px; }
            .panel-items { top: 52px; bottom: 12px; padding: 0 14px; }
            .p-item, .p-item.empty { height: calc(68vw - 66px); }
            .p-item.empty { width: calc((68vw - 66px) * 4/3); }
            .scroll-hint { display: none; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="brand">Mohammad Fasahat</a>
        <div class="nav-right">
            <a href="works.html">Projects</a>
            <a href="about.html">About</a>
            <div class="theme-dot" id="themeDot"></div>
        </div>
    </nav>


    <div class="panels" id="panels">

        <!-- canvas for physics divider lines — injected by JS -->

        <!-- ── 01 VISUALIZATION ────────────────────────── -->
        <div class="panel active" data-panel="viz">
            <div class="label-col"><span class="lc-num">01</span><span class="lc-name">Visualization</span></div>
            <div class="label-exp"><span class="le-num">01</span><span class="le-name">Narrative Visualization</span></div>
            <div class="panel-items">
                <div class="p-item"><img src="images/visualizations/friends-house.jpg" alt="A Friend's House"></div>
                <div class="p-item"><img src="images/visualizations/formenta.jpg" alt="Formenta Island Villa"></div>
                <div class="p-item"><img src="images/visualizations/dragons.jpg" alt="Dragon's Landing"></div>
                <div class="p-item"><img src="images/visualizations/campus.png" alt="Campus"></div>
            </div>
        </div>

        <!-- ── 02 AI & GENERATIVE ──────────────────────── -->
        <div class="panel" data-panel="ai">
            <div class="label-col"><span class="lc-num">02</span><span class="lc-name">AI & Generative</span></div>
            <div class="label-exp"><span class="le-num">02</span><span class="le-name">AI & Generative</span></div>
            <div class="panel-items">
                <div class="p-item empty"></div>
                <div class="p-item empty"></div>
                <div class="p-item empty"></div>
                <div class="p-item empty"></div>
            </div>
        </div>

        <!-- ── 03 COMPUTATIONAL ────────────────────────── -->
        <div class="panel" data-panel="comp">
            <div class="label-col"><span class="lc-num">03</span><span class="lc-name">Computational</span></div>
            <div class="label-exp"><span class="le-num">03</span><span class="le-name">Computational Design</span></div>
            <div class="panel-items">
                <div class="p-item empty"></div>
                <div class="p-item empty"></div>
                <div class="p-item empty"></div>
                <div class="p-item empty"></div>
            </div>
        </div>

        <!-- ── 04 REALTIME ────────────────────────────── -->
        <div class="panel" data-panel="realtime">
            <div class="label-col"><span class="lc-num">04</span><span class="lc-name">Realtime</span></div>
            <div class="label-exp"><span class="le-num">04</span><span class="le-name">Realtime & Interactive</span></div>
            <div class="panel-items">
                <!-- swap empty for: <div class="p-item"><iframe src="https://www.youtube.com/embed/ID"
                     allowfullscreen style="height:100%;width:calc(100%*(16/9));border:none"></iframe></div> -->
                <div class="p-item empty"></div>
                <div class="p-item empty"></div>
                <div class="p-item empty"></div>
                <div class="p-item empty"></div>
            </div>
        </div>

    </div>

    <div class="scroll-hint" id="scrollHint">Scroll to explore →</div>

    <script>
    /* ── THEME ─────────────────────────────────────────── */
    if (localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');

    /* ── MOBILE MENU ────────────────────────────────────── */

    /* ── PANEL EXPAND / COLLAPSE ────────────────────────── */
    const panelsEl   = document.getElementById('panels');
    const panels     = Array.from(panelsEl.querySelectorAll('.panel'));
    const COLLAPSED  = 104;   // must match --col-w
    const N          = panels.length;

    function setWidths(active) {
        const expanded = window.innerWidth - (N - 1) * COLLAPSED;
        panels.forEach(p => p.style.width = (p === active ? expanded : COLLAPSED) + 'px');
    }

    function activatePanel(panel) {
        if (panel.classList.contains('active')) return;
        panels.forEach(p => p.classList.remove('active'));
        panel.classList.add('active');
        setWidths(panel);
        const items = panel.querySelector('.panel-items');
        if (items) { items.scrollLeft = 0; targetScroll = 0; currentScroll = 0; }
        hint.classList.remove('gone');
    }

    panels.forEach(p => p.addEventListener('click', () => activatePanel(p)));
    setWidths(panels.find(p => p.classList.contains('active')));
    window.addEventListener('resize', () => {
        setWidths(panels.find(p => p.classList.contains('active')));
        resizeCanvas();
    });

    /* ── PHYSICS DIVIDER LINES ──────────────────────────── */
    const canvas = document.createElement('canvas');
    canvas.style.cssText = 'position:absolute;inset:0;pointer-events:none;z-index:50;';
    panelsEl.appendChild(canvas);
    const ctx = canvas.getContext('2d');

    const PTS    = 55;
    const SPRING = 0.036;
    const DAMP   = 0.065;
    const P_RAD  = 200;   // mouse influence radius
    const P_FORCE= 0.26;  // very soft push

    // N-1 divider lines, each an array of points {y, x, vx}
    let lines = Array.from({ length: N - 1 }, () =>
        Array.from({ length: PTS }, () => ({ y: 0, x: 0, vx: 0 }))
    );

    let mouse = { x: -9999, y: -9999 };

    function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        const w = panelsEl.offsetWidth, h = panelsEl.offsetHeight;
        canvas.width  = w * dpr;
        canvas.height = h * dpr;
        canvas.style.width  = w + 'px';
        canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        // Re-space points vertically
        lines.forEach(pts => pts.forEach((p, i) => {
            p.y = (i / (PTS - 1)) * h;
        }));
    }

    function initLineX() {
        // Seed x positions from actual panel border positions (called after first layout)
        const pr = panelsEl.getBoundingClientRect();
        lines.forEach((pts, li) => {
            const bx = panels[li].getBoundingClientRect().right - pr.left;
            pts.forEach(p => p.x = bx);
        });
    }

    function drawLines() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const lineColor = getComputedStyle(document.documentElement)
            .getPropertyValue('--line').trim();

        const pr = panelsEl.getBoundingClientRect();

        lines.forEach((pts, li) => {
            const baseX = panels[li].getBoundingClientRect().right - pr.left;

            pts.forEach(p => {
                const dx   = mouse.x - baseX;
                const dy   = mouse.y - p.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                let push = 0;
                if (dist < P_RAD && dist > 0) {
                    // Push away horizontally — very gentle
                    push = (dx > 0 ? -1 : 1) * (1 - dist / P_RAD) * P_FORCE;
                }

                p.vx += push - (p.x - baseX) * SPRING;
                p.vx *= (1 - DAMP);
                p.x  += p.vx;
            });

            // Draw smooth curve through points
            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);
            for (let i = 0; i < pts.length - 1; i++) {
                const xc = (pts[i].x + pts[i+1].x) / 2;
                const yc = (pts[i].y + pts[i+1].y) / 2;
                ctx.quadraticCurveTo(pts[i].x, pts[i].y, xc, yc);
            }
            ctx.lineTo(pts[pts.length-1].x, pts[pts.length-1].y);
            ctx.strokeStyle = lineColor;
            ctx.lineWidth = 1;
            ctx.stroke();
        });

        requestAnimationFrame(drawLines);
    }

    window.addEventListener('mousemove', e => {
        const r = panelsEl.getBoundingClientRect();
        mouse.x = e.clientX - r.left;
        mouse.y = e.clientY - r.top;
    });
    window.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });

    // Init canvas after layout settles
    resizeCanvas();
    requestAnimationFrame(() => { initLineX(); drawLines(); });

    /* ── WHEEL → HORIZONTAL SCROLL ──────────────────────── */
    const hint = document.getElementById('scrollHint');
    let targetScroll = 0, currentScroll = 0, rafId = null;

    function easeScroll() {
        const diff = targetScroll - currentScroll;
        currentScroll += diff * 0.1;
        const el = document.querySelector('.panel.active .panel-items');
        if (el) el.scrollLeft = currentScroll;
        if (Math.abs(diff) > 0.5) {
            rafId = requestAnimationFrame(easeScroll);
        } else {
            currentScroll = targetScroll;
            if (el) el.scrollLeft = targetScroll;
            rafId = null;
        }
    }

    window.addEventListener('wheel', e => {
        if (window.innerWidth <= 768) return;
        e.preventDefault();
        const el = document.querySelector('.panel.active .panel-items');
        if (!el) return;
        const max = el.scrollWidth - el.clientWidth;
        targetScroll = Math.max(0, Math.min(targetScroll + e.deltaY * 1.1, max));
        if (targetScroll > 8) hint.classList.add('gone');
        if (!rafId) rafId = requestAnimationFrame(easeScroll);
    }, { passive: false });

    panelsEl.querySelectorAll('.panel-items').forEach(el => {
        el.addEventListener('scroll', () => {
            if (!rafId) { currentScroll = el.scrollLeft; targetScroll = el.scrollLeft; }
        });
    });
    </script>
</body>
</html>
