<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -40 300 300" width="220" height="220"
     role="img" aria-label="Smart prompt: a prompt is typed and a spark generates" fill="none">
  <defs>
    <style>
      svg { color: #16181d; }
      @media (prefers-color-scheme: dark) { svg { color: #e8eaed; } }
      .pr { stroke: currentColor; fill: none; stroke-linecap: round; stroke-linejoin: round; }

      #pr-type { stroke-dasharray: 70; stroke-dashoffset: 70; animation: prType 6.5s ease-in-out infinite; }
      @keyframes prType { 0%{stroke-dashoffset:70} 26%{stroke-dashoffset:0} 86%{stroke-dashoffset:0} 96%,100%{stroke-dashoffset:70} }
      #pr-caret { animation: prCaret 1.05s steps(1,end) infinite; }
      @keyframes prCaret { 0%,100%{opacity:1} 50%{opacity:0} }
      #pr-spark { transform-box: fill-box; transform-origin: center; animation: prTw 6.5s ease-in-out infinite; }
      @keyframes prTw { 0%,28%{opacity:0;transform:scale(.4)} 40%{opacity:1;transform:scale(1)} 56%{opacity:.25;transform:scale(.65)} 72%{opacity:1;transform:scale(1)} 86%,100%{opacity:0;transform:scale(.4)} }

      @media (prefers-reduced-motion: reduce) {
        #pr-type,#pr-caret,#pr-spark{animation:none}
        #pr-type{stroke-dashoffset:0} #pr-spark{opacity:1}
      }
    </style>
  </defs>

  <!-- AI spark (generation) -->
  <g id="pr-spark" class="pr" stroke-width="2.4">
    <line x1="110" y1="54" x2="110" y2="80"/><line x1="97" y1="67" x2="123" y2="67"/>
  </g>
  <!-- prompt bar -->
  <rect class="pr" stroke-width="1.8" x="40" y="116" width="140" height="30" rx="15" opacity="0.55"/>
  <line id="pr-type" class="pr" stroke-width="2" x1="56" y1="131" x2="122" y2="131" opacity="0.75"/>
  <line id="pr-caret" class="pr" stroke-width="2" x1="132" y1="124" x2="132" y2="138"/>
</svg>
